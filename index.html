// Combines all sessions logged on a given date into the shape a plan day
// needs. Used both when initially generating a plan and when reconciling
// an already-generated plan against newly logged/edited/deleted sessions.
function aggregateSessionsForDate(sessions, dateStr, unit) {
  const matches = sessions.filter((s) => s.date === dateStr);
  if (!matches.length) return null;
  const totalKm = matches.reduce((a, s) => a + s.distanceKm, 0);
  const distDisplay = unit === 'km' ? totalKm : totalKm / KM_PER_MI;
  const avgRpe = matches.reduce((a, s) => a + s.rpe, 0) / matches.length;
  const typesLabel = [...new Set(matches.map((s) => TYPE_META[s.type]?.label || s.type))].join(' + ');
  return {
    distanceLabel: `${distDisplay.toFixed(1)} ${unit}`,
    effortLabel: `RPE ${avgRpe.toFixed(1)}`,
    note: `Already logged (${typesLabel}).`,
  };
}

// Re-syncs the currently-displayed weekly plan against the latest sessions,
// WITHOUT calling the AI again. Any plan day that now has a logged session
// gets marked "Done" (aggregating that day's actual distance/RPE); the
// original AI-suggested workout for that day is preserved so it can be
// restored if the session is later deleted or edited away from that date.
// Returns true if anything actually changed (so the caller knows to persist
// + re-render).
function reconcileWeeklyPlan() {
  if (!state.weeklyPlan) return false;
  const unit = state.config.unit;
  let changed = false;
  const next = state.weeklyPlan.map((d) => {
    const agg = aggregateSessionsForDate(state.sessions, d.date, unit);
    if (agg) {
      if (d.type !== 'Done') {
        changed = true;
        return {
          date: d.date,
          type: 'Done',
          distanceLabel: agg.distanceLabel,
          effortLabel: agg.effortLabel,
          note: agg.note,
          _original: { type: d.type, distanceLabel: d.distanceLabel, effortLabel: d.effortLabel, note: d.note },
        };
      }
      if (d.distanceLabel !== agg.distanceLabel || d.effortLabel !== agg.effortLabel) {
        changed = true;
        return { ...d, distanceLabel: agg.distanceLabel, effortLabel: agg.effortLabel, note: agg.note };
      }
      return d;
    }
    // No session logged for this date (anymore) — revert to the original
    // AI suggestion if this day was auto-marked Done by an earlier
    // reconciliation (not by the AI itself at generation time).
    if (d.type === 'Done' && d._original) {
      changed = true;
      return { ...d._original, date: d.date };
    }
    return d;
  });
  if (changed) {
    state.weeklyPlan = next;
    persistConfig({ ...state.config, weeklyPlan: next, weeklyPlanDate: state.config.weeklyPlanDate });
  }
  return changed;
}

async function handleGenerateWeeklyPlan() {
  state.weeklyPlanLoading = true;
  state.weeklyPlanError = '';
  render();
  try {
    const unit = state.config.unit, config = state.config;
    const summary = buildTrainingSummary(state.sessions, config, unit);
    const validTypes = TYPE_ORDER.join(', ');
    const startDate = todayISO();
    const alreadyLoggedByDate = {};
    state.sessions.forEach((s) => { if (s.date >= startDate && s.date < addDays(startDate, 7)) alreadyLoggedByDate[s.date] = s; });
    const loggedDatesList = Object.keys(alreadyLoggedByDate);
    const unitLabel = unit === 'km' ? 'km' : 'mi';
    const currentPhase = getCurrentPhase(config).key;
    const weeklyCapKm = effectiveWeeklyCapKm(config, todayISO());
    const weeklyCapDisplay = unit === 'km' ? weeklyCapKm : weeklyCapKm / KM_PER_MI;
    const alreadyLoggedDist = Object.values(alreadyLoggedByDate).reduce((a, s) => a + (unit === 'km' ? s.distanceKm : s.distanceKm / KM_PER_MI), 0);
    const remainingBudget = Math.max(2, weeklyCapDisplay - alreadyLoggedDist);

    const system =
      "You are an endurance-training coach planning the NEXT 7 DAYS of running for an athlete training for a half ironman, using their real training log, recent RPE trend, and weekly/monthly volume. Balance hard and easy days (roughly 80% easy effort), include one long run, avoid back-to-back hard days.\n\n" +
      `ATHLETE PROFILE: self-reported experience level is "${config.experienceLevel || 'Intermediate'}", currently in the ${currentPhase} phase. Their weekly running-volume target for THIS phase is about ${Math.round(weeklyCapDisplay)} ${unitLabel} (already scaled for periodization). This is a hard ceiling: the sum of all NEW (non-Rest, non-Done) distances you assign across the 7 days must not exceed roughly ${Math.round(remainingBudget)} ${unitLabel} (accounting for ${Math.round(alreadyLoggedDist)} ${unitLabel} already run this week). Do not default to generic "textbook" distances if they'd blow this budget.\n\n` +
      (currentPhase === 'Build' || currentPhase === 'Peak' ? `If you include a long run, aim it toward (but not exceeding the weekly budget above) the ~${Math.round(unit === 'km' ? evidenceLongRunTargetKm(config.raceDistanceKm) : evidenceLongRunTargetKm(config.raceDistanceKm) / KM_PER_MI)} ${unitLabel} evidence-based long-run threshold noted in the training log data.\n\n` : '') +
      (loggedDatesList.length ? `IMPORTANT: these dates already have a completed session logged — do NOT suggest a new workout for them, output type "Done" for each with a note referencing what was already run: ${loggedDatesList.join(', ')}.\n\n` : '') +
      `Respond with ONLY a raw JSON array (no markdown, no code fences, no commentary) of exactly 7 objects, one per day starting ${startDate}, in this exact shape:\n[{"date":"YYYY-MM-DD","type":"<one of: ${validTypes}, Rest, or Done>","distanceLabel":"short string like '6 km' or '' if Rest/Done","effortLabel":"short effort description or '' if Rest/Done","note":"one short sentence, max ~15 words"}]\n\nTRAINING LOG DATA:\n${summary}`;
    const reply = await callClaude(system, [{ role: 'user', content: 'Plan my next 7 days of running.' }]);
    const cleaned = reply.trim().replace(/^```(json)?/i, '').replace(/```$/, '').trim();
    let parsed = JSON.parse(cleaned);
    if (!Array.isArray(parsed) || !parsed.length) throw new Error('Unexpected response shape');

    parsed = parsed.map((d) => {
      const logged = alreadyLoggedByDate[d.date];
      if (!logged) return d;
      const distDisplay = unit === 'km' ? logged.distanceKm : logged.distanceKm / KM_PER_MI;
      return { date: d.date, type: 'Done', distanceLabel: `${distDisplay.toFixed(1)} ${unit}`, effortLabel: `RPE ${logged.rpe}`, note: `Already logged (${TYPE_META[logged.type]?.label || logged.type}).` };
    });
    const withNums = parsed.map((d) => {
      if (d.type === 'Rest' || d.type === 'Done') return { ...d, _num: 0 };
      const match = String(d.distanceLabel || '').match(/[\d.]+/);
      return { ...d, _num: match ? parseFloat(match[0]) : 0 };
    });
    const plannedTotal = withNums.reduce((a, d) => a + d._num, 0);
    if (plannedTotal > remainingBudget * 1.1 && plannedTotal > 0) {
      const scale = remainingBudget / plannedTotal;
      parsed = withNums.map((d) => {
        if (d._num <= 0) { const { _num, ...rest } = d; return rest; }
        const scaledLabel = (d.distanceLabel || '').replace(/[\d.]+/, (Math.round(d._num * scale * 10) / 10).toString());
        const { _num, ...rest } = d;
        return { ...rest, distanceLabel: scaledLabel };
      });
    } else {
      parsed = withNums.map(({ _num, ...rest }) => rest);
    }
    state.weeklyPlan = parsed;
    const updatedConfig = { ...state.config, weeklyPlan: parsed, weeklyPlanDate: todayISO() };
    persistConfig(updatedConfig);
  } catch (err) {
    state.weeklyPlanError = "Couldn't generate a weekly plan right now.";
  } finally {
    state.weeklyPlanLoading = false;
    render();
  }
}

/* ======================================================================
   Event wiring (re-run after every render since innerHTML wipes listeners)
   ====================================================================== */
function wireEvents() {
  const $ = (id) => document.getElementById(id);
  const on = (id, ev, fn) => { const node = $(id); if (node) node.addEventListener(ev, fn); };

  on('unitKm', 'click', () => { persistConfig({ ...state.config, unit: 'km' }); render(); });
  on('unitMi', 'click', () => { persistConfig({ ...state.config, unit: 'mi' }); render(); });
  on('editConfigBtn', 'click', () => {
    if (!state.editingConfig) {
      state.editingWorkDays = [...(state.config.workDays || DEFAULT_CONFIG.workDays)];
      state.editingWorkDayOverrides = { ...(state.config.workDayOverrides || {}) };
    }
    state.editingConfig = !state.editingConfig;
    render();
  });
  on('saveConfigBtn', 'click', () => {
    const unit = state.config.unit;
    const raceDistanceRaw = Number($('cfgRaceDistance').value);
    const weeklyCapRaw = Number($('cfgWeeklyCap').value);
    const next = {
      ...state.config,
      raceName: $('cfgRaceName').value,
      raceDate: $('cfgRaceDate').value,
      programStartDate: $('cfgStartDate').value,
      experienceLevel: $('cfgExperience').value,
      raceDistanceKm: raceDistanceRaw > 0 ? (unit === 'km' ? raceDistanceRaw : raceDistanceRaw * KM_PER_MI) : state.config.raceDistanceKm,
      weeklyVolumeCapKm: weeklyCapRaw > 0 ? (unit === 'km' ? weeklyCapRaw : weeklyCapRaw * KM_PER_MI) : state.config.weeklyVolumeCapKm,
      workDays: state.editingWorkDays ? [...state.editingWorkDays].sort() : state.config.workDays,
      workDayOverrides: state.editingWorkDayOverrides || state.config.workDayOverrides || {},
    };
    // The weekly plan is generated by the AI under a specific set of
    // assumptions (race date/distance, experience level, volume target, work
    // schedule). If any of those change, the cached plan no longer reflects
    // reality and should be cleared so the user is prompted to regenerate
    // rather than silently shown a stale plan built for a different goal.
    const goalFieldsChanged =
      next.raceDate !== state.config.raceDate ||
      next.raceDistanceKm !== state.config.raceDistanceKm ||
      next.experienceLevel !== state.config.experienceLevel ||
      next.weeklyVolumeCapKm !== state.config.weeklyVolumeCapKm ||
      JSON.stringify(next.workDays) !== JSON.stringify(state.config.workDays) ||
      JSON.stringify(next.workDayOverrides) !== JSON.stringify(state.config.workDayOverrides || {});
    if (goalFieldsChanged && state.weeklyPlan) {
      state.weeklyPlan = null;
      next.weeklyPlan = null;
      next.weeklyPlanDate = null;
      toast('Your goal changed — regenerate your weekly plan to reflect it.');
    }
    persistConfig(next);
    state.editingConfig = false;
    render();
  });
  on('cancelConfigBtn', 'click', () => { state.editingConfig = false; render(); });
  document.querySelectorAll('.workday-toggle').forEach((btn) => btn.addEventListener('click', () => {
    const day = Number(btn.dataset.day);
    const set = new Set(state.editingWorkDays || state.config.workDays);
    if (set.has(day)) set.delete(day); else set.add(day);
    state.editingWorkDays = [...set];
    render();
  }));
  document.querySelectorAll('.workday-override-toggle').forEach((btn) => btn.addEventListener('click', () => {
    const date = btn.dataset.date;
    const overrides = { ...(state.editingWorkDayOverrides || state.config.workDayOverrides || {}) };
    const effectiveConfig = { workDays: state.editingWorkDays || state.config.workDays, workDayOverrides: overrides };
    const currentlyWork = isWorkDay(date, effectiveConfig);
    overrides[date] = !currentlyWork; // flip whatever the effective status currently is
    state.editingWorkDayOverrides = overrides;
    render();
  }));
  on('clearOverridesBtn', 'click', () => { state.editingWorkDayOverrides = {}; render(); });
  on('cfgExperience', 'change', (e) => {
    // live-update the weekly cap field to the new level's default without requiring Save first
    const level = e.target.value;
    const capField = $('cfgWeeklyCap');
    if (capField) {
      const km = experienceWeeklyCapKm(level, state.config.raceDistanceKm);
      capField.value = Math.round(state.config.unit === 'km' ? km : km / KM_PER_MI);
    }
  });

  on('exportJsonBtn', 'click', () => exportJSON(state.sessions, state.config));
  on('exportCsvBtn', 'click', () => exportCSV(state.sessions));
  on('importBtn', 'click', () => $('fileInput').click());
  on('fileInput', 'change', (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => handleImportText(String(reader.result || ''));
    reader.readAsText(file);
    e.target.value = '';
  });
  on('importGpxBtn', 'click', () => $('gpxFileInput').click());
  on('gpxFileInput', 'change', (e) => {
    const file = e.target.files?.[0];
    if (file) handleGpxFile(file);
    e.target.value = '';
  });

  on('openFormBtn', 'click', () => { resetForm(); state.showForm = true; render(); });
  on('closeFormBtn', 'click', () => { state.showForm = false; resetForm(); render(); });
  on('cancelEditBtn', 'click', () => { state.showForm = false; resetForm(); render(); });
  on('saveSessionBtn', 'click', () => {
    state.form = {
      date: $('formDate').value, type: $('formType').value, distance: $('formDistance').value,
      duration: $('formDuration').value, hr: $('formHr').value, rpe: Number($('formRpe').value), notes: $('formNotes').value,
    };
    handleSaveSession();
  });
  on('formRpe', 'input', (e) => { const v = $('rpeVal'); if (v) v.textContent = e.target.value; });

  document.querySelectorAll('.edit-session-btn').forEach((btn) => btn.addEventListener('click', () => {
    const session = state.sessions.find((s) => s.id === btn.dataset.id);
    if (session) handleEditStart(session);
  }));
  document.querySelectorAll('.delete-session-btn').forEach((btn) => btn.addEventListener('click', () => handleDeleteSession(btn.dataset.id)));

  on('chartTypeSelect', 'change', (e) => { state.chartType = e.target.value; render(); });
  on('statsPeriodWeek', 'click', () => { state.statsPeriod = 'week'; render(); });
  on('statsPeriodMonth', 'click', () => { state.statsPeriod = 'month'; render(); });

  on('navTraining', 'click', () => { state.page = 'training'; render(); });
  on('navLeaderboard', 'click', () => { state.page = 'leaderboard'; render(); handleLoadLeaderboard(); });
  on('lbPeriodWeek', 'click', () => { state.leaderboardPeriod = 'week'; handleLoadLeaderboard(); });
  on('lbPeriodMonth', 'click', () => { state.leaderboardPeriod = 'month'; handleLoadLeaderboard(); });
  document.querySelectorAll('.lb-sortable').forEach((el) => el.addEventListener('click', () => {
    const key = el.dataset.sortKey;
    const cur = state.leaderboardSort || {};
    if (cur.key === key) {
      state.leaderboardSort = { key, dir: cur.dir === 'asc' ? 'desc' : 'asc' };
    } else {
      state.leaderboardSort = { key, dir: LB_DEFAULT_DIR[key] || 'desc' };
    }
    render();
  }));
  on('lbSaveBtn', 'click', () => {
    const name = $('lbDisplayName').value.trim() || currentUser.email.split('@')[0];
    const optin = $('lbOptIn').checked;
    handleSaveProfile(name, optin);
  });

  on('elaborateBtn', 'click', handleElaborateSuggestion);
  on('generatePlanBtn', 'click', handleGenerateWeeklyPlan);
  on('regeneratePlanBtn', 'click', (e) => { e.stopPropagation(); handleGenerateWeeklyPlan(); });
  on('weeklyHeaderRow', 'click', () => { if (state.weeklyPlan) { state.weeklyExpanded = !state.weeklyExpanded; render(); } });

  on('chatSendBtn', 'click', handleSendChat);
  on('chatInputEl', 'keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); handleSendChat(); } });

  on('signOutBtn', 'click', async () => { await supabaseClient.auth.signOut(); });
}

function showAuthGate() {

function resetTransientState() {

  state.profile = null;

  state.leaderboardError = '';
  state.showForm = false;
  state.editingId = null;
  state.editingConfig = false;
  state.chatMessages = [];
  state.chatError = '';
  state.aiNote = '';
  state.weeklyPlan = null; // repopulated from persisted config in loadStateForCurrentUser, if present and not stale
  state.weeklyPlanError = '';
  state.weeklyExpanded = false;
}
async function showApp() {
  resetTransientState();
  document.getElementById('authGate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  await loadStateForCurrentUser();
  render();
}
function setAuthMessage(kind, text) {
  const errEl = document.getElementById('authError');
  const msgEl = document.getElementById('authMsg');
  errEl.style.display = 'none'; msgEl.style.display = 'none';
  if (kind === 'error') { errEl.textContent = text; errEl.style.display = 'block'; }
  if (kind === 'ok') { msgEl.textContent = text; msgEl.style.display = 'block'; }
}
function wireAuthGate() {
  document.getElementById('loginBtn').addEventListener('click', async () => {
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    if (!email || !password) return setAuthMessage('error', 'Enter both email and password.');
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) setAuthMessage('error', error.message);
  });
  document.getElementById('signupBtn').addEventListener('click', async () => {
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    if (!email || !password) return setAuthMessage('error', 'Enter both email and password.');
    if (password.length < 6) return setAuthMessage('error', 'Password must be at least 6 characters.');
    const { error } = await supabaseClient.auth.signUp({ email, password });
    if (error) setAuthMessage('error', error.message);
    else setAuthMessage('ok', 'Account created! Check your email if confirmation is required, then log in.');
  });
}

wireAuthGate();
supabaseClient.auth.onAuthStateChange((event, session) => {
  currentUser = session?.user || null;
  if (currentUser) showApp();
  else showAuthGate();
});
</script>
